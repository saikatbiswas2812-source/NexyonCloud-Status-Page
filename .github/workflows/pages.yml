name: Deploy status page
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'site/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static website only
        run: |
          rm -rf dist
          mkdir -p dist/site dist/data
          cp index.html admin.html dist/
          cp -R site/. dist/site/
          cp data/status.json dist/data/status.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages

      - name: Verify artifact is visible to GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const maxAttempts = 20;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });

              const artifact = response.data.artifacts.find(item =>
                item.name === "github-pages" && !item.expired
              );

              if (artifact) {
                core.info(`GitHub Pages artifact visible: ${artifact.id} (${artifact.size_in_bytes} bytes)`);
                return;
              }

              core.info(`Artifact not visible yet (attempt ${attempt}/${maxAttempts}); retrying in 3 seconds.`);
              if (attempt < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }

            throw new Error("The github-pages artifact was uploaded but did not become visible through the GitHub Actions API after 60 seconds. Deployment stopped safely.");

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
